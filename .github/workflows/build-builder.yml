name: Build builder base

# Builds + pushes the jarvis-builder base image (ADR 0021 P2) to
# ghcr.io. The main ISO build (build-iso.yml) FROMs this image, so it
# skips the Fedora toolchain install + whisper/piper/numbat builds —
# ~8-12 min off every ISO build.
#
# Run this:
#   - automatically when iso/Containerfile.builder changes on main
#   - automatically when Cargo.lock changes — the base pre-warms our Rust
#     dependency tree (ADR 0021 P2), so a dep bump must re-warm it
#   - manually (workflow_dispatch) after bumping a pinned tool version
#
# Rebuilt only on toolchain / tool bumps or a dependency change — NOT on
# ordinary source edits — so this workflow's runtime doesn't gate normal
# development. While it re-warms, the main build keeps using the previous
# base and just recompiles the changed deps incrementally.

on:
  push:
    branches: [main]
    paths:
      - "iso/Containerfile.builder"
      - ".github/workflows/build-builder.yml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-builder:
    name: Build + push jarvis-builder
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build builder base
        run: |
          # Lowercase the owner — ghcr refuses uppercase in image paths.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Stamp the image with the hash of the Containerfile that built it.
          # build-iso.yml reads this label and rebuilds the base locally when
          # it doesn't match the source — so adding a compile-time devel
          # package here never leaves the image build compiling against a
          # stale base (the qt6-qtquick3d-devel race that broke #30).
          HASH=$(sha256sum iso/Containerfile.builder | cut -d' ' -f1)
          sudo podman build \
            --file iso/Containerfile.builder \
            --label "org.jarvis.base-hash=${HASH}" \
            --tag "ghcr.io/${OWNER}/jarvis-builder:latest" \
            .

      - name: Push builder base
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sudo podman push "ghcr.io/${OWNER}/jarvis-builder:latest"
