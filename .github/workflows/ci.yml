name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs: pushing a new commit to the same branch/PR aborts
# the in-flight run instead of letting both grind to the end. The biggest CI
# time saver when iterating with several commits in a row.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libwayland-egl-backend-dev \
            wayland-protocols \
            libseat-dev \
            libgbm-dev \
            libdrm-dev \
            libinput-dev \
            libudev-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libdbus-1-dev \
            libsqlite3-dev \
            libasound2-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # One workspace-wide test run instead of a step per crate — identical
      # coverage, far less per-step overhead. The separate `cargo build
      # --workspace` was redundant: clippy --all-targets above already
      # compiles everything, and `cargo test` builds what it runs.
      - name: Test (workspace)
        run: cargo test --workspace

  schema-lint:
    name: Validate JSON Schemas
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate action schemas
        run: |
          for schema in system/action-bus/schema/actions/*.schema.json; do
            echo "Validating $schema..."
            ajv compile -s "$schema" --spec=draft2020 -c ajv-formats
          done
          ajv compile -s system/action-bus/schema/request.schema.json --spec=draft2020 -c ajv-formats
          ajv compile -s system/action-bus/schema/response.schema.json --spec=draft2020 -c ajv-formats
