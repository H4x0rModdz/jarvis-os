name: Build runtime base

# Builds + pushes the jarvis-runtime base image (ADR 0021 P2, runtime half)
# to ghcr.io. The main image build (build-iso.yml) does `FROM` this image for
# its final stage, so it skips the ~30 min of desktop dnf installs + Flatpak
# app downloads (Firefox/Dolphin/Zed ~2.5 GB) + WhiteSur theme build + Ollama
# install on every per-merge update.
#
# Run this:
#   - automatically when iso/Containerfile.runtime or one of the assets it
#     bakes changes on main
#   - manually (workflow_dispatch) to refresh the pinned Flatpak apps / theme
#
# Rebuilt RARELY — only when packages / apps / theme change — so its own
# runtime doesn't gate normal development. While it rebuilds, the main build
# keeps using the previous runtime base.

on:
  push:
    branches: [main]
    paths:
      - "iso/Containerfile.runtime"
      - ".github/workflows/build-runtime.yml"
      - "iso/assets/theme/**"
      - "iso/assets/xdg/mimeapps.list"
      - "iso/assets/xdg-desktop-portal/labwc-portals.conf"
      - "iso/assets/sysctl/99-jarvis-userns.conf"
  # Weekly rebuild so kernel + security updates from the fedora-bootc base
  # keep flowing. The base (and thus the kernel) now lives in this rarely-
  # rebuilt image, so without this it would freeze between code changes.
  # build-iso.yml has a cron a few hours later that republishes the OS image
  # on the freshly-pulled base, so `bootc upgrade` actually delivers it.
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-runtime:
    name: Build + push jarvis-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # The runtime image is large (desktop + Flatpaks + Ollama's GPU
          # bundles), so reclaim the runner's preinstalled toolchains we never
          # use. hostedtoolcache alone is ~10 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/lib/node_modules
          sudo apt-get clean
          sudo docker image prune --all --force || true
          df -h /

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Move container storage to /mnt (big disk)
        # The runner's root disk (~20 GB) can't hold this image plus its build
        # cache: Ollama's GPU bundles overflow /var/tmp during the layer commit
        # ("no space left on device"). /mnt is the runner's big ephemeral disk
        # (~74 GB). Bind-mount podman's storage AND the blob-staging /var/tmp
        # onto it BEFORE any podman command touches storage — every podman step
        # then inherits the space transparently, no per-command flags needed.
        run: |
          sudo mkdir -p /mnt/containers /var/lib/containers /mnt/vartmp /var/tmp
          sudo mount --bind /mnt/containers /var/lib/containers
          sudo mount --bind /mnt/vartmp /var/tmp
          df -h / /mnt

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build runtime base
        run: |
          # Lowercase the owner — ghcr refuses uppercase in image paths.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # Stamp the Containerfile hash so build-iso.yml can detect a stale
          # published base and rebuild locally (see build-builder.yml). Covers
          # the Containerfile itself — a new runtime package (e.g. qt6-qtquick3d)
          # then can't ship in an image built against the old base. Asset-only
          # tweaks still rely on this workflow's normal trigger.
          HASH=$(sha256sum iso/Containerfile.runtime | cut -d' ' -f1)
          # --pull=newer: always re-pull the fedora-bootc base so the weekly
          # rebuild actually picks up new kernel/security layers. Storage + blob
          # staging live on /mnt (see the "Move container storage to /mnt" step).
          sudo podman build \
            --pull=newer \
            --file iso/Containerfile.runtime \
            --label "org.jarvis.base-hash=${HASH}" \
            --tag "ghcr.io/${OWNER}/jarvis-runtime:latest" \
            .

      - name: Push runtime base
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sudo podman push "ghcr.io/${OWNER}/jarvis-runtime:latest"
