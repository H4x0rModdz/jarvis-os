name: Build OS image + ISO

on:
  push:
    # Every push to main builds + publishes the OS image to ghcr — the
    # OTA target `bootc upgrade` pulls (no ISO, no reinstall). Tag pushes
    # additionally cut the installer ISO + a release.
    branches:
      - main
    tags:
      - "v*.*.*"
    # Docs-only commits don't change the OS image (README / docs / .jarvis
    # aren't copied into it), but `COPY . .` in the Containerfile would
    # bust the build cache and republish an identical :latest. Skip the
    # build when a push touches ONLY these paths; a mixed code+docs push
    # still builds. (Path filters also apply to tag pushes — cut release
    # tags from a commit with real changes, or use workflow_dispatch.)
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".jarvis/**"
      - "LICENSE"
      # Windows-side build tooling — never copied into the OS image, so a
      # change here can't affect what gets published.
      - "tools/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for this build (e.g. 0.0.1-dev)"
        required: true
        default: "0.0.1-dev"

# A newer push to the same ref cancels the in-flight image build — only the
# latest matters for the OTA channel, so we don't burn ~tens of minutes
# finishing a build that's already superseded.
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # for release upload
  packages: write   # for ghcr.io push (optional)

jobs:
  build-iso:
    name: Build OCI image + ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        # The Containerfile pulls a Fedora base + wayblue base + builds two
        # Rust targets + a Qt project. Stock ubuntu-24.04 runners are tight.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Branch push (main): a moving dev version. The image still
            # publishes as :latest, which is what bootc upgrade tracks.
            echo "tag=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman

      - name: Log in to ghcr.io
        # Needed both to pull the published builder base (P2) and to
        # push/pull the OCI layer cache (P3). Best-effort: a fork
        # without packages perms still builds, just without the cache.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin || true

      - name: Resolve builder base
        # ADR 0021 P2: the main image FROMs a prebuilt jarvis-builder
        # (toolchain + whisper + piper + numbat). Pull it from ghcr if
        # build-builder.yml has published it; otherwise build it locally
        # so this workflow stays self-sufficient (first run, or a fork
        # without the published base). Either way BUILDER_IMAGE points
        # at a tag in local podman storage for the OCI build.
        id: builder
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REF="ghcr.io/${OWNER}/jarvis-builder:latest"
          if sudo podman pull "$REF" 2>/dev/null; then
            echo "using published builder: $REF"
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "no published builder — building locally"
            sudo podman build \
              --file iso/Containerfile.builder \
              --tag localhost/jarvis-builder:local \
              .
            echo "ref=localhost/jarvis-builder:local" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve runtime base
        # ADR 0021 P2 (runtime half): the final image FROMs a prebuilt
        # jarvis-runtime (desktop packages + Flatpak apps + WhiteSur +
        # Ollama). Pull it from ghcr if build-runtime.yml has published it;
        # otherwise build it locally so this workflow stays self-sufficient
        # (first run, or a fork without the published base). Either way
        # RUNTIME_IMAGE points at a tag in local podman storage.
        id: runtime
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REF="ghcr.io/${OWNER}/jarvis-runtime:latest"
          if sudo podman pull "$REF" 2>/dev/null; then
            echo "using published runtime: $REF"
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "no published runtime — building locally"
            sudo podman build \
              --file iso/Containerfile.runtime \
              --tag localhost/jarvis-runtime:local \
              .
            echo "ref=localhost/jarvis-runtime:local" >> "$GITHUB_OUTPUT"
          fi

      - name: Build OCI image
        # Must run as root so the image lands in the same storage that
        # bootc-image-builder (also root) reads from in the next step.
        # Otherwise rootless podman puts it in ~/.local/share/containers and
        # bootc-image-builder fails with "image not known".
        #
        # ADR 0021 P3: --layers + a registry layer cache. The final
        # stage's stable, expensive layers — the bootc base, the dnf
        # runtime install, and the ~2 GB of Flatpak app installs
        # (Firefox/Dolphin/Zed/KDE runtime) — restore from
        # ghcr.io/<owner>/jarvis-os-cache instead of re-downloading
        # every run. cache-from/to are best-effort (|| true keeps a
        # cacheless run working on forks without packages perms).
        # Note: the builder stage's cargo `--mount=type=cache` does NOT
        # round-trip through --cache-to (podman limitation) — that
        # warming is deferred; the P2 base already removes the heavy
        # toolchain rebuild, which was the bigger cost.
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          CACHE="ghcr.io/${OWNER}/jarvis-os-cache"
          IMG="ghcr.io/${OWNER}/jarvis-os"
          # Tag with the registry ref (not localhost) so the installed
          # system's bootc origin points at ghcr — i.e. it knows where to
          # `bootc upgrade` from. :latest is the moving OTA tag; the
          # version tag is an immutable record of this build.
          sudo podman build \
            --file iso/Containerfile \
            --layers \
            --cache-from "$CACHE" \
            --cache-to "$CACHE" \
            --build-arg "JARVIS_VERSION=${{ steps.version.outputs.tag }}" \
            --build-arg "BUILDER_IMAGE=${{ steps.builder.outputs.ref }}" \
            --build-arg "RUNTIME_IMAGE=${{ steps.runtime.outputs.ref }}" \
            --tag "${IMG}:latest" \
            --tag "${IMG}:${{ steps.version.outputs.tag }}" \
            . || \
          sudo podman build \
            --file iso/Containerfile \
            --build-arg "JARVIS_VERSION=${{ steps.version.outputs.tag }}" \
            --build-arg "BUILDER_IMAGE=${{ steps.builder.outputs.ref }}" \
            --build-arg "RUNTIME_IMAGE=${{ steps.runtime.outputs.ref }}" \
            --tag "${IMG}:latest" \
            --tag "${IMG}:${{ steps.version.outputs.tag }}" \
            .

      - name: Push OS image to ghcr (OTA target)
        # This is what makes `bootc upgrade` work without a reinstall:
        # installed systems track ghcr.io/<owner>/jarvis-os:latest and
        # pull the new image from here. Runs on every build (main pushes
        # included) so the OTA channel is always current.
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${OWNER}/jarvis-os"
          sudo podman push "${IMG}:latest"
          sudo podman push "${IMG}:${{ steps.version.outputs.tag }}"
          echo "Published ${IMG}:latest — VMs can now 'bootc upgrade'."

      # ── Installer ISO — only on tags / manual dispatch ───────────────
      # The ISO is just the first-install medium; routine updates go OTA
      # via the pushed image above, so we don't spend ~Anaconda time on
      # every main push.
      - name: Convert OCI to ISO
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          mkdir -p iso/output
          sudo podman run --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/iso/output:/output" \
            -v "$PWD/iso/build.toml:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs btrfs \
            --config /config.toml \
            "ghcr.io/${OWNER}/jarvis-os:latest"

      - name: Locate ISO
        id: iso
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          ISO=$(find iso/output -name "*.iso" | head -1)
          test -n "$ISO" || { echo "no iso produced"; exit 1; }
          ls -lh "$ISO"
          echo "path=$ISO" >> "$GITHUB_OUTPUT"

      - name: Upload as workflow artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-${{ steps.version.outputs.tag }}.iso
          path: ${{ steps.iso.outputs.path }}
          if-no-files-found: error

      - name: Attach to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.iso.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
