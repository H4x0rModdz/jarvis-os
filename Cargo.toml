[workspace]
resolver = "2"
members = [
    "system/action-bus",
    "system/permission",
    "system/updater",
    "system/settings",
    "system/voice",
    "system/notifications",
    "system/compat",
    "system/lock",
    "system/pam-jarvis",
    "shell/compositor",
    "ai/lilith",
    "sdk/jarvis-sdk-types",
    "tools/voice-ctl",
    "tools/jarvis-app",
    "tools/lock-ctl",
    "tools/voiceprint-ctl",
    "examples/sdk-hello",
]

# Shared metadata. Crates opt in with `license.workspace = true`; the
# repo-root LICENSE (GPL-3.0) is the operative grant regardless.
[workspace.package]
license = "GPL-3.0-only"
repository = "https://github.com/H4x0rModdz/jarvis-os"
