# System-wide GTK defaults. Installed at /etc/gtk-3.0/settings.ini and
# /etc/gtk-4.0/settings.ini so every GTK app (Firefox via Flatpak,
# any future GTK tool) picks up WhiteSur without a per-user config.
#
# Our own Qt/QML shell ignores this entirely — it has its own design
# language. This is purely for the third-party GTK apps.
[Settings]
gtk-theme-name=WhiteSur-Dark
gtk-icon-theme-name=WhiteSur
gtk-cursor-theme-name=WhiteSur-cursors
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=true
gtk-font-name=Cantarell 11
