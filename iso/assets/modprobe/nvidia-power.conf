# NVIDIA module options (ADR 0032).
#
# NVreg_PreserveVideoMemoryAllocations=1 — save VRAM contents to system RAM
# across suspend instead of discarding them. Without it the NVIDIA driver drops
# video memory on suspend and the desktop comes back corrupted or black; this is
# the single most common suspend/resume complaint on NVIDIA + Wayland, and it is
# what the nvidia-suspend/resume/hibernate systemd units (enabled in the
# runtime Containerfile) exist to work with.
#
# Only applies to a loaded nvidia module, so this file is inert on AMD/Intel
# machines and in VMs.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
