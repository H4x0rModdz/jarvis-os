# xdg-desktop-portal backend routing for the Jarvis (labwc) session.
# Matched by XDG_CURRENT_DESKTOP=labwc (see iso/assets/labwc/environment).
#
# ScreenCast + Screenshot go to the wlroots backend (labwc speaks
# wlr-screencopy) so browser screen-share / video calls work. Everything
# else — FileChooser, Settings, Notification, ... — goes to GTK, which is
# the only backend that implements them on a wlroots session.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
