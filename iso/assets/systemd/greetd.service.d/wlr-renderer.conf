# greetd spawns cage; cage is a wlroots compositor and tries EGL/GBM
# first, which fails on most virtualised GPUs (VirtualBox VMSVGA, headless
# QEMU, anything without working dmabuf). Forcing the pixman software
# renderer keeps the login screen rendering on the CPU — a perfectly
# adequate fallback for a login surface, and the difference vs. EGL is
# invisible to the eye for a static glass card.
#
# The post-login labwc session inherits matching values from the env
# array the greeter sends to greetd in `start_session` — see
# `shell/jarvis-greeter/src/greetd_client.cpp`.
[Service]
Environment=WLR_RENDERER=pixman
Environment=WLR_NO_HARDWARE_CURSORS=1
