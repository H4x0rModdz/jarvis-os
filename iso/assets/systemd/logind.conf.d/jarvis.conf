# LilithOS logind policy.
#
# Fedora's default already suspends on lid close and short-press of
# the power button. We declare them explicitly so the behaviour is
# pinned against bootc upgrades that might change upstream defaults
# (and so this file is the one place to look when something needs
# tuning).
#
# `HandleLidSwitchExternalPower=suspend` covers the laptop-docked
# case — without it, Fedora keeps the laptop running on lid close
# when AC is connected. Most users still want suspend; the docking-
# station case is rare on a personal notebook.
#
# `IdleAction=ignore` is deliberately not auto-suspending the
# desktop on idle — `swayidle` already handles screen lock at 5 min
# (system/lock daemon), and forcing a suspend on top of that
# fights with the AI assistant's expectation that it should be
# reachable. A future power-profile setting can opt in.

[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
IdleAction=ignore
