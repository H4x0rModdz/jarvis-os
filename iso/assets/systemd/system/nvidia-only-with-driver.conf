# Only start on a machine where the NVIDIA kernel module is actually loaded.
#
# The image ships the NVIDIA driver on every machine (ADR 0032/0033), and its
# packages enable these units unconditionally. Without the module — a VM, an
# AMD/Intel box, or Secure Boot refusing a not-yet-enrolled module — they fail
# on every boot ("[FAILED] Failed to start nvidia-persistenced.service" on the
# console, repeatedly, as it retries). A skipped unit is silent.
[Unit]
ConditionPathExists=/sys/module/nvidia
