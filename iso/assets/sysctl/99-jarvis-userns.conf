# Nested unprivileged user namespaces.
#
# Flatpak apps that run their OWN inner sandbox — Firefox's content
# process is the classic one — call clone(CLONE_NEWUSER) a second time,
# nested inside the flatpak's bubblewrap namespace. When the kernel's
# user-namespace budget is zero/exhausted that nested clone() returns
# EPERM, Firefox logs
#     Sandbox: CanCreateUserNamespace() clone() failure: EPERM
# and never opens a window — so clicking it in the dock silently does
# nothing (the launch "succeeds" because flatpak forks fine; Firefox
# only dies afterwards setting up its sandbox).
#
# A generous budget restores nested namespaces. 28633 is the long-standing
# Fedora/Arch default; plenty for flatpak + an inner app sandbox.
user.max_user_namespaces = 28633
