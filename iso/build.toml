# bootc-image-builder configuration.
#
# Turns the OCI image produced by `Containerfile` into an installable ISO.
# See: https://github.com/osbuild/bootc-image-builder

[customizations]

# Anaconda installer is on by default — we keep it so the user goes through
# a normal Fedora installer in the VM. ADR 0029 Phase B will swap for a custom
# LilithOS-branded installer (Qt + `bootc install to-disk`).

[[customizations.user]]
name = "jarvis"
# Transient install password. The first-boot wizard ("Defina sua senha")
# replaces it via /usr/libexec/jarvis-set-password (ADR 0029). Kept as a real
# value (not blank/locked) so sudo / SSH / dev-deploy work on day one and there
# is no lockout window; the user is expected to set their own on first boot.
password = "jarvis"
groups = ["wheel"]

[customizations.kernel]
# Wayland session works best when we keep the kernel boot params minimal.
append = "quiet rhgb"
