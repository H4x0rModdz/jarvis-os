# bootc-image-builder configuration.
#
# Turns the OCI image produced by `Containerfile` into an installable ISO.
# See: https://github.com/osbuild/bootc-image-builder

[customizations]

# Anaconda installer is on by default — we keep it so the user goes through
# a normal Fedora installer in the VM. Phase 2 will swap for a custom
# Jarvis-branded installer.

[[customizations.user]]
name = "jarvis"
# Default dev password. The first-boot updater will prompt the user to
# change this. Production builds replace this with a runtime-prompted
# kickstart.
password = "jarvis"
groups = ["wheel"]

[customizations.kernel]
# Wayland session works best when we keep the kernel boot params minimal.
append = "quiet rhgb"
