[package]
name = "jarvis-lock"
version = "0.1.0"
edition = "2021"
description = "Session lock daemon — owns com.jarvis.Lock and spawns the Qt lock window"

[[bin]]
name = "jarvis-lock"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util"] }
zbus               = { version = "4", features = ["tokio"] }
