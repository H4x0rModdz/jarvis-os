[package]
name = "jarvis-compat"
version = "0.1.0"
edition = "2021"
description = "Windows app compatibility daemon — owns Wine prefixes + RunExe"

[[bin]]
name = "jarvis-compat"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
chrono             = { version = "0.4", features = ["serde"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "fs", "io-util"] }
zbus               = { version = "4", features = ["tokio"] }
dirs               = "5"
# install_proton needs HTTP + streaming so we can report download
# progress. rustls-tls avoids dragging the system openssl into the
# image — the bootc base has rustls-friendly trust roots.
reqwest            = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util       = "0.3"
