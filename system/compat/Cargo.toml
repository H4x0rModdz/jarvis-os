[package]
name = "jarvis-compat"
version = "0.1.0"
edition = "2021"
description = "Windows app compatibility daemon — owns Wine prefixes + RunExe"

[[bin]]
name = "jarvis-compat"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
chrono             = { version = "0.4", features = ["serde"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process"] }
zbus               = { version = "4", features = ["tokio"] }
dirs               = "5"
