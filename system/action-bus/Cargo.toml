[package]
name = "jarvis-action-bus"
version = "0.1.0"
edition = "2021"
description = "Jarvis OS Action Bus — central orchestration daemon"

[[bin]]
name = "jarvis-action-bus"
path = "src/main.rs"

[dependencies]
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
dirs        = "5"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid        = { version = "1", features = ["v4", "serde"] }
zbus        = { version = "4", features = ["tokio"] }
jarvis-sdk-types = { path = "../../sdk/jarvis-sdk-types" }

[dev-dependencies]
tokio-test = "0.4"
