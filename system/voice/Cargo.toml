[package]
name = "jarvis-voice"
version = "0.1.0"
edition = "2021"
description = "Voice pipeline daemon — push-to-talk STT + reply TTS"

[[bin]]
name = "jarvis-voice"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
zbus               = { version = "4", features = ["tokio"] }
