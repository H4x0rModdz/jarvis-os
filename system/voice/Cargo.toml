[package]
name = "jarvis-voice"
version = "0.1.0"
edition = "2021"
description = "Voice pipeline daemon — push-to-talk STT + reply TTS"

[[bin]]
name = "jarvis-voice"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "process"] }
async-trait        = "0.1"
zbus               = { version = "4", features = ["tokio"] }

# V2 — STT via whisper.cpp subprocess.
# cpal handles the microphone capture (ALSA backend on Linux). hound
# writes the captured samples to a temporary WAV file in the shape
# whisper-cli expects: 16-bit signed PCM, 16 kHz, mono.
cpal               = "0.15"
hound              = "3"

# V4 — voiceprint storage. SQLite holds the feature vectors so
# enrollments survive daemon restarts. Bundled feature pulls in the
# sqlite3 static lib; same configuration as system/settings.
rusqlite           = { version = "0.32", features = ["bundled"] }
dirs               = "5"
# Used by voiceprint.rs to stamp set_at / updated_at on enrolled
# rows in RFC3339 — matches the Lilith fact store column shape.
chrono             = { version = "0.4", features = ["serde"] }

# V5 — real MFCC matcher. realfft is the real-valued wrapper around
# rustfft (saves us writing the conjugate-symmetric optimisation for
# half-spectrum bins ourselves). Pure-Rust dep, no system libs.
realfft            = "3"
