[package]
name = "jarvis-voice"
version = "0.1.0"
edition = "2021"
description = "Voice pipeline daemon — push-to-talk STT + reply TTS"

[[bin]]
name = "jarvis-voice"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
zbus               = { version = "4", features = ["tokio"] }

# V2 — STT via whisper.cpp subprocess.
# cpal handles the microphone capture (ALSA backend on Linux). hound
# writes the captured samples to a temporary WAV file in the shape
# whisper-cli expects: 16-bit signed PCM, 16 kHz, mono.
cpal               = "0.15"
hound              = "3"
