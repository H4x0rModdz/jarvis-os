[package]
name = "jarvis-sdk-types"
version = "0.1.0"
edition = "2021"
description = "Manifest types + loader for Jarvis OS SDK apps"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
thiserror  = "1"
regex      = "1"
once_cell  = "1"
tracing    = "0.1"
