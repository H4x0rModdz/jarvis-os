[package]
name = "jarvis-lock-ctl"
version = "0.1.0"
edition = "2021"
description = "Tiny remote for com.jarvis.Lock — bound to a labwc keybind"

[[bin]]
name = "jarvis-lock-ctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio  = { version = "1", features = ["rt", "macros"] }
zbus   = { version = "4", features = ["tokio"] }
