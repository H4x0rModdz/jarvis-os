[package]
name = "jarvis-voice-ctl"
version = "0.1.0"
edition = "2021"
description = "Tiny CLI that drives com.jarvis.Voice — bound to a global hotkey by the compositor"

[[bin]]
name = "jarvis-voice-ctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
tokio  = { version = "1", features = ["rt", "macros"] }
zbus   = { version = "4", features = ["tokio"] }
