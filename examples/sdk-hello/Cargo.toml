[package]
name = "sdk-hello"
version = "0.1.0"
edition = "2021"
description = "Smallest possible Jarvis SDK app — two demo actions over com.jarvis.app.sdk_hello"

[[bin]]
name = "sdk-hello"
path = "src/main.rs"

[dependencies]
anyhow             = "1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tokio              = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus               = { version = "4", features = ["tokio"] }
